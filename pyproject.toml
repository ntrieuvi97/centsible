[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "centsible"
version = "0.8.0"
description = "Repo memory and loop guard for AI coding agents, with savings reported as verified vs estimated. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Vi Nguyen" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ntrieuvi97/centsible"
Issues = "https://github.com/ntrieuvi97/centsible/issues"

[project.scripts]
centsible = "centsible.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "centsible*"]
