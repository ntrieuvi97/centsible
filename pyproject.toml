[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "centsible"
version = "0.7.1"
description = "Experience-driven cost and token optimization for AI coding agents (Antigravity & Claude Code)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Vi Nguyen", url = "https://github.com/ntrieuvi97" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
centsible = "centsible.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "centsible*"]
